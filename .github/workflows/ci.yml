name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: nix develop -c just ci-install

      - name: Format check
        run: nix develop -c just format-check

      - name: Lint
        run: nix develop -c just lint

      - name: Typecheck
        run: nix develop -c just typecheck

      - name: Test
        run: nix develop -c just test

      - name: Build
        run: nix develop -c just build

      - name: Install E2E browsers
        run: nix develop -c just install-e2e-browsers

      - name: E2E
        run: nix develop -c just e2e

      - name: Terraform check
        run: nix develop -c just terraform-check

      - name: Detect secrets
        run: nix develop -c just gitleaks

      - name: Scan npm lockfile
        run: nix develop -c just osv

      - name: Verify pinned GitHub Actions
        run: nix develop -c just pinact
